# Continuous Deployment.
#   push to "staging" -> test, build images, deploy to the staging EC2 server
#   push to "main"    -> test, build images, deploy to the production EC2 server
#
# Each GitHub Environment (staging / production) holds its own secrets with the
# same names, so one job definition deploys to either server.
name: Deploy

on:
  push:
    branches: [main, staging]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false # never cancel a deploy halfway

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # GHCR image names must be lowercase.
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build:
    name: Build & push images
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: backend
            context: backend
            file: backend/Dockerfile
          - name: frontend
            context: .
            file: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          build-args: APP_VERSION=${{ github.sha }}
          # Tag with the commit SHA (exact release) and the branch name.
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}:${{ github.ref_name }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    name: Deploy to ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    needs: build
    # Skipped until the server is set up: create a repository variable
    # DEPLOY_ENABLED=true (Settings > Secrets and variables > Actions > Variables).
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
      url: https://${{ vars.DOMAIN }}
    steps:
      - uses: actions/checkout@v4

      - name: Copy compose file and scripts to the server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.prod.yml,scripts/*"
          target: /opt/app

      - name: Pull new images and restart containers
        uses: appleboy/ssh-action@v1.2.0
        env:
          TAG: ${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: TAG,GHCR_USER,GHCR_TOKEN
          script: |
            set -e
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            cd /opt/app
            chmod +x scripts/*.sh
            TAG="$TAG" ./scripts/deploy.sh
            docker logout ghcr.io

      - name: Post-deploy health check
        run: bash ./scripts/healthcheck.sh "https://${{ vars.DOMAIN }}/api/health/" 12
