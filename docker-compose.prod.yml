# Production / staging stack. Runs on the EC2 server from /opt/app.
# Images are built by GitHub Actions and pulled from GitHub Container Registry.
#
# Required variables (in /opt/app/.env on the server):
#   IMAGE_PREFIX, TAG, DOMAIN, DJANGO_SECRET_KEY, POSTGRES_* ...

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 10

  backend:
    image: ${IMAGE_PREFIX}/backend:${TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy
    # Gunicorn is the image's default CMD; it is only reachable through Nginx.
    expose:
      - "8000"

  nginx:
    image: ${IMAGE_PREFIX}/frontend:${TAG:-latest}
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
      BACKEND_HOST: backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - backend
    # Reload every 6h so renewed certificates are picked up.
    command: /bin/sh -c "while :; do sleep 6h & wait $${!}; nginx -s reload; done & /docker-entrypoint.sh nginx -g 'daemon off;'"

  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    # Try to renew twice a day; certbot only renews when < 30 days remain.
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done"

volumes:
  pgdata:
